    icon: "https://flagcdn.com/w320/hk.png"
  - <<: *urltest_base
    name: 香港-自动
    url: "https://1.1.1.1/cdn-cgi/trace"
    expected-status: 200
    timeout: 10000
    lazy: true
    filter: "(?i)(广港|香港|Hong ?Kong|HKG|🇭🇰|(^|[^A-Z])HK([^A-Z]|$))"
