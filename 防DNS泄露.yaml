    type: url-test
    interval: 300
    tolerance: 50
    url: "https://1.1.1.1/cdn-cgi/trace"
    expected-status: 200
    lazy: false
    hidden: true
    include-all: true
    timeout: 10000
    filter: "(?i)^(?!.*(官网|套餐|流量|异常|剩余|到期|过期|更新|联系|群|回国|中国|China|上海|北京|广州|深圳|江苏|浙江|🇨🇳)).*$"
