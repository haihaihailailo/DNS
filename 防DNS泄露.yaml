# --- 9. 远程规则集 rule-providers ---
# 从 MetaCubeX meta-rules-dat 拉取常用 geosite/geoip 规则，供 RULE-SET 调用。
rule-providers:
  # 广告过滤规则集，作为 domain provider 模板。
  reject: &meta_domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 节点选择
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
    path: "./ruleset/metacubex/category-ads-all.mrs"
  # 私有/局域网域名规则集。
  private:
    <<: *meta_domain
