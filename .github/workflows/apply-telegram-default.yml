name: Apply Telegram Singapore-auto default

on:
  push:
    branches:
      - agent/default-telegram-singapore-auto
    paths:
      - ".github/workflows/apply-telegram-default.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: agent/default-telegram-singapore-auto

      - name: Update Telegram default consistently
        run: |
          python3 <<'PY'
          from pathlib import Path

          changes = {
              "防DNS泄露.yaml": [
                  (
                      "proxies: [自动选择, 新加坡-自动, 节点选择, 香港-自动, 香港节点, 台湾-自动, 台湾节点, 日本-自动, 日本节点, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点, 越南-自动, 越南节点, 中国-自动, 中国节点, DIRECT]",
                      "proxies: [新加坡-自动, 自动选择, 节点选择, 香港-自动, 香港节点, 台湾-自动, 台湾节点, 日本-自动, 日本节点, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点, 越南-自动, 越南节点, 中国-自动, 中国节点, DIRECT]",
                  ),
              ],
              "防DNS泄露.js": [
                  (
                      '{ name: "电报消息", type: "select", proxies: ["自动选择", "新加坡-自动", "节点选择", "香港-自动", "香港节点", "台湾-自动", "台湾节点", "日本-自动", "日本节点", "新加坡节点", "美国-自动", "美国节点", "韩国-自动", "韩国节点", "越南-自动", "越南节点", "中国-自动", "中国节点", "DIRECT"],',
                      '{ name: "电报消息", type: "select", proxies: ["新加坡-自动", "自动选择", "节点选择", "香港-自动", "香港节点", "台湾-自动", "台湾节点", "日本-自动", "日本节点", "新加坡节点", "美国-自动", "美国节点", "韩国-自动", "韩国节点", "越南-自动", "越南节点", "中国-自动", "中国节点", "DIRECT"],',
                  ),
              ],
              "stash.stoverride": [
                  (
                      "proxies: [自动选择, 新加坡-自动, 节点选择, 香港-自动, 香港节点, 台湾-自动, 台湾节点, 日本-自动, 日本节点, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点, 越南-自动, 越南节点, DIRECT]",
                      "proxies: [新加坡-自动, 自动选择, 节点选择, 香港-自动, 香港节点, 台湾-自动, 台湾节点, 日本-自动, 日本节点, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点, 越南-自动, 越南节点, DIRECT]",
                  ),
              ],
              ".github/scripts/validate_health_checks.py": [
                  ('if first_proxy != "自动选择":', 'if first_proxy != "新加坡-自动":'),
                  ('f"{filename}: Telegram must default to 自动选择, "', 'f"{filename}: Telegram must default to 新加坡-自动, "'),
                  ('if \'{ name: "电报消息", type: "select", proxies: ["自动选择",\' not in js_text:', 'if \'{ name: "电报消息", type: "select", proxies: ["新加坡-自动",\' not in js_text:'),
                  ('fail("防DNS泄露.js: Telegram does not default to 自动选择")', 'fail("防DNS泄露.js: Telegram does not default to 新加坡-自动")'),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{filename}: expected one occurrence, found {count}: {old[:80]}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate updated files
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "stash.stoverride"].each { |f| YAML.safe_load_file(f, aliases: true); puts "#{f} YAML OK" }'
          node --check "防DNS泄露.js"
          python3 .github/scripts/validate_health_checks.py

      - name: Commit synchronized update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "防DNS泄露.yaml" "防DNS泄露.js" "stash.stoverride" ".github/scripts/validate_health_checks.py"
          git commit -m "Default Telegram to Singapore auto"
          git push origin HEAD:agent/default-telegram-singapore-auto
