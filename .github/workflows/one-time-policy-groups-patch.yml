name: One-time policy group patch

on:
  push:
    paths:
      - ".github/workflows/one-time-policy-groups-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch policy groups
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          yaml_path = repo / '防DNS泄露.yaml'
          js_path = repo / '防DNS泄露.js'
          stash_path = repo / 'stash.stoverride'

          yaml_text = yaml_path.read_text(encoding='utf-8')
          js_text = js_path.read_text(encoding='utf-8')
          stash_text = stash_path.read_text(encoding='utf-8')

          yaml_text = yaml_text.replace(
              'proxies: [越南-自动, DIRECT, 越南节点, 新加坡-自动, 新加坡节点, 节点选择]',
              'proxies: [越南-自动, DIRECT, 越南节点, 新加坡-自动, 新加坡节点, 香港-自动, 香港节点, 节点选择]',
          )
          yaml_text = re.sub(
              r'\n\n  # 全局直连：只包含 DIRECT，用于需要强制直连的场景。\n  - name: 全局直连\n    type: select\n    proxies: \[DIRECT\]\n    url: "https://www\.baidu\.com"\n    expected-status: 200/302\n    interval: 300\n    icon: "https://testingcf\.jsdelivr\.net/gh/clash-verge-rev/clash-verge-rev\.github\.io@main/docs/assets/icons/link\.svg"\n',
              '',
              yaml_text,
          )

          js_text = js_text.replace(
              'proxies: ["越南-自动", "DIRECT", "越南节点", "新加坡-自动", "新加坡节点", "节点选择"]',
              'proxies: ["越南-自动", "DIRECT", "越南节点", "新加坡-自动", "新加坡节点", "香港-自动", "香港节点", "节点选择"]',
          )
          js_text = js_text.replace(
              'proxies: ["香港-自动", "新加坡-自动", "日本-自动", "美国-自动", "香港节点", "新加坡节点", "日本节点", "美国节点", "节点选择"], url: "https://github.com"',
              'proxies: ["香港-自动", "新加坡-自动", "日本-自动", "美国-自动", "香港节点", "新加坡节点", "日本节点", "美国节点", "节点选择", "DIRECT"], url: "https://github.com"',
          )
          js_text = js_text.replace(
              'proxies: ["美国节点", "日本节点", "新加坡节点", "香港节点", "美国-自动", "日本-自动", "新加坡-自动", "香港-自动", "节点选择"], url: "https://chatgpt.com/cdn-cgi/trace"',
              'proxies: ["美国节点", "日本节点", "新加坡节点", "香港节点", "美国-自动", "日本-自动", "新加坡-自动", "香港-自动", "节点选择", "DIRECT"], url: "https://chatgpt.com/cdn-cgi/trace"',
          )
          js_text = js_text.replace(
              'proxies: ["节点选择", "新加坡节点", "日本节点", "香港节点", "美国节点", "新加坡-自动", "日本-自动", "香港-自动", "美国-自动", "自动选择"], url: "https://www.gstatic.com/generate_204"',
              'proxies: ["节点选择", "新加坡节点", "日本节点", "香港节点", "美国节点", "新加坡-自动", "日本-自动", "香港-自动", "美国-自动", "自动选择", "DIRECT"], url: "https://www.gstatic.com/generate_204"',
          )
          js_text = re.sub(
              r'\n  \{ name: "全局直连", type: "select", proxies: \["DIRECT"\], url: "https://www\.baidu\.com", "expected-status": "200/302", interval: 300, icon: "https://testingcf\.jsdelivr\.net/gh/clash-verge-rev/clash-verge-rev\.github\.io@main/docs/assets/icons/link\.svg" \},',
              '',
              js_text,
          )

          stash_text = re.sub(
              r'\n  - name: 全局直连\n    type: select\n    proxies: \[DIRECT\]\n',
              '',
              stash_text,
          )

          for name, text in [
              ('防DNS泄露.yaml', yaml_text),
              ('防DNS泄露.js', js_text),
              ('stash.stoverride', stash_text),
          ]:
              if 'name: 全局直连' in text or 'name: "全局直连"' in text:
                  raise SystemExit(f'{name}: 全局直连 still exists')

          for text, name in [(yaml_text, 'YAML'), (js_text, 'JS'), (stash_text, 'Stash')]:
              if '越南-自动, DIRECT, 越南节点, 新加坡-自动, 新加坡节点, 香港-自动, 香港节点, 节点选择' not in text and '"越南-自动", "DIRECT", "越南节点", "新加坡-自动", "新加坡节点", "香港-自动", "香港节点", "节点选择"' not in text:
                  raise SystemExit(f'{name}: 越南服务 not unified')

          yaml_path.write_text(yaml_text, encoding='utf-8')
          js_path.write_text(js_text, encoding='utf-8')
          stash_path.write_text(stash_text, encoding='utf-8')
          Path('.github/workflows/one-time-policy-groups-patch.yml').unlink()
          PY

      - name: Validate changed files parse
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "stash.stoverride"].each { |file| YAML.safe_load_file(file, aliases: true); puts "#{file} YAML OK" }'
          node --check "防DNS泄露.js"

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 防DNS泄露.yaml 防DNS泄露.js stash.stoverride .github/workflows/one-time-policy-groups-patch.yml
          git commit -m "fix: align policy groups"
          git push
