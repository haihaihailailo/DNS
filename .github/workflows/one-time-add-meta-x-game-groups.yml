name: One-time add Meta X and game groups

on:
  push:
    paths:
      - ".github/workflows/one-time-add-meta-x-game-groups.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch policy groups and rules
        run: |
          python3 <<'PY'
          from pathlib import Path

          yaml_path = Path('防DNS泄露.yaml')
          js_path = Path('防DNS泄露.js')
          stash_path = Path('stash.stoverride')

          yaml_text = yaml_path.read_text(encoding='utf-8')
          js_text = js_path.read_text(encoding='utf-8')
          stash_text = stash_path.read_text(encoding='utf-8')

          yaml_insert_after = '''  # Telegram：优先新加坡自动，兼顾低延迟和稳定性。
  - name: 电报消息
    type: select
    proxies: [新加坡-自动, 自动选择, 节点选择, 香港-自动, 香港节点, 台湾-自动, 台湾节点, 日本-自动, 日本节点, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点, 越南-自动, 越南节点, 中国-自动, 中国节点, DIRECT]
    url: "https://core.telegram.org"
    expected-status: 200/301/302
    interval: 300
    icon: "https://testingcf.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/telegram.svg"
'''
          yaml_new_groups = yaml_insert_after + '''

  # Meta / X：Facebook、Instagram、Threads、Messenger、WhatsApp、X / Twitter 统一策略。
  - name: Meta / X
    type: select
    proxies: [节点选择, 自动选择, 新加坡-自动, 新加坡节点, 香港-自动, 香港节点, 日本-自动, 日本节点, 美国-自动, 美国节点, 台湾-自动, 台湾节点, DIRECT]
    url: "https://www.facebook.com"
    expected-status: 200/301/302
    interval: 300
    icon: "https://www.facebook.com/favicon.ico"


  # 游戏平台：Steam、Epic、Battle.net、Riot、Ubisoft、EA 等平台单独切换。
  - name: 游戏平台
    type: select
    proxies: [节点选择, DIRECT, 自动选择, 香港-自动, 香港节点, 日本-自动, 日本节点, 新加坡-自动, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点]
    url: "https://store.steampowered.com"
    expected-status: 200/301/302
    interval: 300
    icon: "https://store.steampowered.com/favicon.ico"
'''
          if '  - name: Meta / X\n' not in yaml_text:
              yaml_text = yaml_text.replace(yaml_insert_after, yaml_new_groups)

          # App/process routing in YAML.
          yaml_replacements = {
              'PROCESS-NAME,com.twitter.android,节点选择': 'PROCESS-NAME,com.twitter.android,Meta / X',
              'PROCESS-NAME,com.facebook.katana,节点选择': 'PROCESS-NAME,com.facebook.katana,Meta / X',
              'PROCESS-NAME,com.facebook.orca,节点选择': 'PROCESS-NAME,com.facebook.orca,Meta / X',
              'PROCESS-NAME,com.instagram.android,节点选择': 'PROCESS-NAME,com.instagram.android,Meta / X',
              'PROCESS-NAME,com.instagram.barcelona,节点选择': 'PROCESS-NAME,com.instagram.barcelona,Meta / X',
              'PROCESS-NAME,com.whatsapp,节点选择': 'PROCESS-NAME,com.whatsapp,Meta / X',
              'PROCESS-NAME,WhatsApp.exe,节点选择': 'PROCESS-NAME,WhatsApp.exe,Meta / X',
              'PROCESS-NAME,Messenger.exe,节点选择': 'PROCESS-NAME,Messenger.exe,Meta / X',
              'PROCESS-NAME,com.valvesoftware.android.steam.community,节点选择': 'PROCESS-NAME,com.valvesoftware.android.steam.community,游戏平台',
              'PROCESS-NAME,steam.exe,节点选择': 'PROCESS-NAME,steam.exe,游戏平台',
              'PROCESS-NAME,steamwebhelper.exe,节点选择': 'PROCESS-NAME,steamwebhelper.exe,游戏平台',
              'PROCESS-NAME,EpicGamesLauncher.exe,节点选择': 'PROCESS-NAME,EpicGamesLauncher.exe,游戏平台',
              'PROCESS-NAME,EpicWebHelper.exe,节点选择': 'PROCESS-NAME,EpicWebHelper.exe,游戏平台',
              'PROCESS-NAME,Battle.net.exe,节点选择': 'PROCESS-NAME,Battle.net.exe,游戏平台',
              'PROCESS-NAME,RiotClientServices.exe,节点选择': 'PROCESS-NAME,RiotClientServices.exe,游戏平台',
              'PROCESS-NAME,UbisoftConnect.exe,节点选择': 'PROCESS-NAME,UbisoftConnect.exe,游戏平台',
              'PROCESS-NAME,EA app.exe,节点选择': 'PROCESS-NAME,EA app.exe,游戏平台',
              'PROCESS-NAME,EADesktop.exe,节点选择': 'PROCESS-NAME,EADesktop.exe,游戏平台',
          }
          for old, new in yaml_replacements.items():
              yaml_text = yaml_text.replace(old, new)

          yaml_domain_anchor = '''  - "RULE-SET,telegram,电报消息"
  - "RULE-SET,telegramcidr,电报消息,no-resolve"
'''
          yaml_domain_insert = yaml_domain_anchor + '''
  - "DOMAIN-SUFFIX,x.com,Meta / X"
  - "DOMAIN-SUFFIX,twitter.com,Meta / X"
  - "DOMAIN-SUFFIX,t.co,Meta / X"
  - "DOMAIN-SUFFIX,twimg.com,Meta / X"
  - "DOMAIN-SUFFIX,facebook.com,Meta / X"
  - "DOMAIN-SUFFIX,facebook.net,Meta / X"
  - "DOMAIN-SUFFIX,fbcdn.net,Meta / X"
  - "DOMAIN-SUFFIX,messenger.com,Meta / X"
  - "DOMAIN-SUFFIX,instagram.com,Meta / X"
  - "DOMAIN-SUFFIX,cdninstagram.com,Meta / X"
  - "DOMAIN-SUFFIX,threads.net,Meta / X"
  - "DOMAIN-SUFFIX,whatsapp.com,Meta / X"
  - "DOMAIN-SUFFIX,whatsapp.net,Meta / X"

  - "DOMAIN-SUFFIX,steampowered.com,游戏平台"
  - "DOMAIN-SUFFIX,steamcommunity.com,游戏平台"
  - "DOMAIN-SUFFIX,steamstatic.com,游戏平台"
  - "DOMAIN-SUFFIX,steamcontent.com,游戏平台"
  - "DOMAIN-SUFFIX,epicgames.com,游戏平台"
  - "DOMAIN-SUFFIX,epicgamescdn.com,游戏平台"
  - "DOMAIN-SUFFIX,battle.net,游戏平台"
  - "DOMAIN-SUFFIX,blizzard.com,游戏平台"
  - "DOMAIN-SUFFIX,riotgames.com,游戏平台"
  - "DOMAIN-SUFFIX,ubisoft.com,游戏平台"
  - "DOMAIN-SUFFIX,ea.com,游戏平台"
'''
          if 'DOMAIN-SUFFIX,x.com,Meta / X' not in yaml_text:
              yaml_text = yaml_text.replace(yaml_domain_anchor, yaml_domain_insert)

          # JS proxy groups: must stay exactly synchronized with YAML.
          js_insert_after = '''  { name: "电报消息", type: "select", proxies: ["新加坡-自动", "自动选择", "节点选择", "香港-自动", "香港节点", "台湾-自动", "台湾节点", "日本-自动", "日本节点", "新加坡节点", "美国-自动", "美国节点", "韩国-自动", "韩国节点", "越南-自动", "越南节点", "中国-自动", "中国节点", "DIRECT"], url: "https://core.telegram.org", "expected-status": "200/301/302", interval: 300, icon: "https://testingcf.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/telegram.svg" },
'''
          js_new_groups = js_insert_after + '''  { name: "Meta / X", type: "select", proxies: ["节点选择", "自动选择", "新加坡-自动", "新加坡节点", "香港-自动", "香港节点", "日本-自动", "日本节点", "美国-自动", "美国节点", "台湾-自动", "台湾节点", "DIRECT"], url: "https://www.facebook.com", "expected-status": "200/301/302", interval: 300, icon: "https://www.facebook.com/favicon.ico" },
  { name: "游戏平台", type: "select", proxies: ["节点选择", "DIRECT", "自动选择", "香港-自动", "香港节点", "日本-自动", "日本节点", "新加坡-自动", "新加坡节点", "美国-自动", "美国节点", "韩国-自动", "韩国节点"], url: "https://store.steampowered.com", "expected-status": "200/301/302", interval: 300, icon: "https://store.steampowered.com/favicon.ico" },
'''
          if 'name: "Meta / X"' not in js_text:
              js_text = js_text.replace(js_insert_after, js_new_groups)

          for old, new in yaml_replacements.items():
              js_text = js_text.replace(old, new)

          if 'DOMAIN-SUFFIX,x.com,Meta / X' not in js_text:
              js_text = js_text.replace(yaml_domain_anchor, yaml_domain_insert)

          # Stash groups and domain rules.
          stash_insert_after = '''  - name: 电报消息
    type: select
    proxies: [新加坡-自动, 自动选择, 节点选择, 香港-自动, 香港节点, 台湾-自动, 台湾节点, 日本-自动, 日本节点, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点, 越南-自动, 越南节点, DIRECT]
'''
          stash_new_groups = stash_insert_after + '''
  - name: Meta / X
    type: select
    proxies: [节点选择, 自动选择, 新加坡-自动, 新加坡节点, 香港-自动, 香港节点, 日本-自动, 日本节点, 美国-自动, 美国节点, 台湾-自动, 台湾节点, DIRECT]

  - name: 游戏平台
    type: select
    proxies: [节点选择, DIRECT, 自动选择, 香港-自动, 香港节点, 日本-自动, 日本节点, 新加坡-自动, 新加坡节点, 美国-自动, 美国节点, 韩国-自动, 韩国节点]
'''
          if '  - name: Meta / X\n' not in stash_text:
              stash_text = stash_text.replace(stash_insert_after, stash_new_groups)

          stash_domain_anchor = '''  - RULE-SET,telegram,电报消息
  - RULE-SET,telegramcidr,电报消息,no-resolve
'''
          stash_domain_insert = stash_domain_anchor + '''  - DOMAIN-SUFFIX,x.com,Meta / X
  - DOMAIN-SUFFIX,twitter.com,Meta / X
  - DOMAIN-SUFFIX,t.co,Meta / X
  - DOMAIN-SUFFIX,twimg.com,Meta / X
  - DOMAIN-SUFFIX,facebook.com,Meta / X
  - DOMAIN-SUFFIX,facebook.net,Meta / X
  - DOMAIN-SUFFIX,fbcdn.net,Meta / X
  - DOMAIN-SUFFIX,messenger.com,Meta / X
  - DOMAIN-SUFFIX,instagram.com,Meta / X
  - DOMAIN-SUFFIX,cdninstagram.com,Meta / X
  - DOMAIN-SUFFIX,threads.net,Meta / X
  - DOMAIN-SUFFIX,whatsapp.com,Meta / X
  - DOMAIN-SUFFIX,whatsapp.net,Meta / X

  - DOMAIN-SUFFIX,steampowered.com,游戏平台
  - DOMAIN-SUFFIX,steamcommunity.com,游戏平台
  - DOMAIN-SUFFIX,steamstatic.com,游戏平台
  - DOMAIN-SUFFIX,steamcontent.com,游戏平台
  - DOMAIN-SUFFIX,epicgames.com,游戏平台
  - DOMAIN-SUFFIX,epicgamescdn.com,游戏平台
  - DOMAIN-SUFFIX,battle.net,游戏平台
  - DOMAIN-SUFFIX,blizzard.com,游戏平台
  - DOMAIN-SUFFIX,riotgames.com,游戏平台
  - DOMAIN-SUFFIX,ubisoft.com,游戏平台
  - DOMAIN-SUFFIX,ea.com,游戏平台
'''
          if 'DOMAIN-SUFFIX,x.com,Meta / X' not in stash_text:
              stash_text = stash_text.replace(stash_domain_anchor, stash_domain_insert)

          for name, text in [('YAML', yaml_text), ('JS', js_text), ('Stash', stash_text)]:
              for required in ['Meta / X', '游戏平台', 'DOMAIN-SUFFIX,x.com,Meta / X', 'DOMAIN-SUFFIX,steampowered.com,游戏平台']:
                  if required not in text:
                      raise SystemExit(f'{name}: missing {required}')

          yaml_path.write_text(yaml_text, encoding='utf-8')
          js_path.write_text(js_text, encoding='utf-8')
          stash_path.write_text(stash_text, encoding='utf-8')
          Path('.github/workflows/one-time-add-meta-x-game-groups.yml').unlink()
          PY

      - name: Validate parse and source sync
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "stash.stoverride"].each { |file| YAML.safe_load_file(file, aliases: true); puts "#{file} YAML OK" }'
          node --check "防DNS泄露.js"
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "yaml"
          yaml_config = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)
          node_code = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const code = fs.readFileSync("防DNS泄露.js", "utf8");
            const sandbox = { console };
            vm.createContext(sandbox);
            const result = vm.runInContext(`${code}\n;main({});`, sandbox, { filename: "防DNS泄露.js" });
            process.stdout.write(JSON.stringify(result));
          NODE
          stdout, stderr, status = Open3.capture3("node", "-e", node_code)
          abort stderr unless status.success?
          js_config = JSON.parse(stdout)
          keys = %w[proxy-groups rules]
          abort "YAML/JS proxy-groups or rules not synchronized" unless keys.all? { |k| yaml_config[k] == js_config[k] }
          puts "YAML/JS policy groups and rules synchronized."
          RUBY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 防DNS泄露.yaml 防DNS泄露.js stash.stoverride .github/workflows/one-time-add-meta-x-game-groups.yml
          git commit -m "feat: add Meta X and game policy groups"
          git push
