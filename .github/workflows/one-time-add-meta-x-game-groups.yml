name: One-time add Meta X and game groups

on:
  push:
    paths:
      - ".github/meta-x-game.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch config files
        run: python3 .github/scripts/add-meta-x-game.py

      - name: Validate
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "stash.stoverride"].each { |file| YAML.safe_load_file(file, aliases: true) }'
          node --check "防DNS泄露.js"
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "yaml"
          yaml_config = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)
          node_code = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const code = fs.readFileSync("防DNS泄露.js", "utf8");
            const sandbox = { console };
            vm.createContext(sandbox);
            const result = vm.runInContext(`${code}\n;main({});`, sandbox, { filename: "防DNS泄露.js" });
            process.stdout.write(JSON.stringify(result));
          NODE
          stdout, stderr, status = Open3.capture3("node", "-e", node_code)
          abort stderr unless status.success?
          js_config = JSON.parse(stdout)
          keys = %w[proxy-groups rules]
          abort "YAML/JS proxy-groups or rules not synchronized" unless keys.all? { |k| yaml_config[k] == js_config[k] }
          puts "YAML/JS policy groups and rules synchronized."
          RUBY

      - name: Clean temporary files and commit patch
        run: |
          rm -f .github/scripts/add-meta-x-game.py .github/meta-x-game.trigger .github/workflows/one-time-add-meta-x-game-groups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 防DNS泄露.yaml 防DNS泄露.js stash.stoverride .github/scripts/add-meta-x-game.py .github/meta-x-game.trigger .github/workflows/one-time-add-meta-x-game-groups.yml
          git commit -m "feat: add Meta X and game policy groups"
          git push
