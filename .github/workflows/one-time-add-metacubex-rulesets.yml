name: One-time add MetaCubeX rulesets

on:
  push:
    paths:
      - ".github/metacubex-rulesets.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch config files
        run: python3 .github/scripts/add-metacubex-rulesets.py

      - name: Validate
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "stash.stoverride"].each { |file| YAML.safe_load_file(file, aliases: true) }'
          node --check "防DNS泄露.js"

      - name: Clean temporary files and commit patch
        run: |
          rm -f .github/scripts/add-metacubex-rulesets.py .github/metacubex-rulesets.trigger .github/workflows/one-time-add-metacubex-rulesets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 防DNS泄露.yaml 防DNS泄露.js stash.stoverride .github/scripts/add-metacubex-rulesets.py .github/metacubex-rulesets.trigger .github/workflows/one-time-add-metacubex-rulesets.yml
          git commit -m "feat: add MetaCubeX rulesets"
          git push
