name: One-time fix Mihomo config

on:
  push:
    branches:
      - agent/fix-mihomo-config
    paths:
      - ".github/fix-mihomo-config.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply configuration fixes
        run: python3 .github/scripts/apply-config-fixes.py

      - name: Parse YAML and check JavaScript syntax
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "stash.stoverride"].each { |file| YAML.safe_load_file(file, aliases: true); puts "#{file} YAML OK" }'
          node --check "防DNS泄露.js"

      - name: Check YAML and JS synchronization
        run: |
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "yaml"

          keys = %w[unified-delay profile geo-auto-update geo-update-interval tcp-concurrent sniffer tun dns proxy-groups rule-providers rules]
          yaml_config = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)
          node_code = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const file = process.argv[process.argv.length - 1];
            const code = fs.readFileSync(file, "utf8");
            const sandbox = { console };
            vm.createContext(sandbox);
            const result = vm.runInContext(`${code}\n;main({});`, sandbox, { filename: file });
            process.stdout.write(JSON.stringify(result));
          NODE
          stdout, stderr, status = Open3.capture3("node", "-e", node_code, "防DNS泄露.js")
          abort stderr unless status.success?
          js_config = JSON.parse(stdout)

          normalize = lambda do |value, path = []|
            case value
            when Hash
              value.keys.sort.to_h { |key| [key, normalize.call(value[key], path + [key.to_s])] }
            when Array
              normalized = value.map { |item| normalize.call(item, path) }
              path.last == "ports" ? normalized.map(&:to_s) : normalized
            else
              path.last == "expected-status" ? value.to_s : value
            end
          end

          yaml_selected = normalize.call(keys.to_h { |key| [key, yaml_config[key]] })
          js_selected = normalize.call(keys.to_h { |key| [key, js_config[key]] })
          abort "YAML and JS are not synchronized" unless yaml_selected == js_selected
          puts "YAML and JS are synchronized."
          RUBY

      - name: Run policy semantic checks
        run: |
          ruby <<'RUBY'
          require "yaml"
          main = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)
          stash = YAML.safe_load_file("stash.stoverride", aliases: true)
          errors = []
          dns = main.fetch("dns", {})
          tun = main.fetch("tun", {})
          bootstrap = Array(dns["default-nameserver"])
          errors << "unencrypted bootstrap DNS" unless bootstrap.any? && bootstrap.all? { |item| item.to_s.match?(%r{\A(?:https|tls)://}) }
          errors << "direct DNS policy disabled" unless dns["direct-nameserver-follow-policy"] == true
          errors << "dns.ipv6 still forced" if dns.key?("ipv6")
          errors << "fake-ip-range6 still forced" if dns.key?("fake-ip-range6")
          errors << "TUN IPv6 address still forced" if tun.key?("inet6-address")
          groups = Array(main["proxy-groups"]).to_h { |group| [group["name"], group] }
          errors << "Vietnam not DIRECT-first" unless Array(groups.dig("越南服务", "proxies")).first == "DIRECT"
          errors << "AI not automatic-first" unless Array(groups.dig("AI", "proxies")).first.to_s.end_with?("-自动")
          rules = Array(main["rules"])
          ad_index = rules.index("RULE-SET,reject,广告过滤")
          openai_index = rules.index("RULE-SET,openai,AI")
          errors << "ad rule priority incorrect" unless ad_index && openai_index && ad_index < openai_index
          Hash(main["rule-providers"] || {}).each do |name, provider|
            errors << "provider #{name} lacks proxy" unless provider["proxy"] == "节点选择"
          end
          Hash(stash["rule-providers"] || {}).each do |name, provider|
            errors << "Stash provider #{name} still uses GitHub Raw" if provider["url"].to_s.include?("raw.githubusercontent.com")
          end
          errors << "Stash dns.ipv6 still forced" if Hash(stash["dns"] || {}).key?("ipv6")
          abort errors.join("\n") if errors.any?
          puts "Semantic checks passed."
          RUBY

      - name: Download latest Mihomo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          url="$(echo "$release_json" | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v1-v.*\\.gz$")) | .browser_download_url' | head -n 1)"
          test -n "$url"
          curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL "$url" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          ./mihomo -v
          ./mihomo -t -f "防DNS泄露.yaml"

      - name: Commit patched configuration
        run: |
          rm -f mihomo
          rm -f .github/scripts/apply-config-fixes.py
          rm -f .github/fix-mihomo-config.trigger
          rm -f .github/workflows/one-time-fix-mihomo-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 防DNS泄露.yaml 防DNS泄露.js stash.stoverride README.md .github/workflows/validate-config.yml \
            .github/scripts/apply-config-fixes.py .github/fix-mihomo-config.trigger .github/workflows/one-time-fix-mihomo-config.yml
          git commit -m "fix: harden Mihomo DNS and routing defaults"
          git push origin HEAD:agent/fix-mihomo-config
