name: Bootstrap Mihomo config patch

on:
  pull_request:
    paths:
      - ".github/workflows/validate-config.yml"
      - ".github/scripts/apply-config-fixes.py"
      - ".github/fix-mihomo-config.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-mihomo-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/fix-mihomo-config'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore normal validation workflow
        run: git show origin/main:.github/workflows/validate-config.yml > .github/workflows/validate-config.yml

      - name: Apply configuration fixes
        run: python3 .github/scripts/apply-config-fixes.py

      - name: Parse YAML and check JavaScript syntax
        run: |
          ruby -e 'require "yaml"; ["防DNS泄露.yaml", "stash.stoverride"].each { |file| YAML.safe_load_file(file, aliases: true); puts "#{file} YAML OK" }'
          node --check "防DNS泄露.js"

      - name: Verify policy semantics
        run: |
          ruby <<'RUBY'
          require "yaml"
          main = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)
          stash = YAML.safe_load_file("stash.stoverride", aliases: true)
          errors = []
          dns = main.fetch("dns", {})
          tun = main.fetch("tun", {})
          bootstrap = Array(dns["default-nameserver"])
          errors << "unencrypted bootstrap DNS" unless bootstrap.any? && bootstrap.all? { |item| item.to_s.match?(%r{\A(?:https|tls)://}) }
          errors << "direct DNS policy disabled" unless dns["direct-nameserver-follow-policy"] == true
          errors << "dns.ipv6 still forced" if dns.key?("ipv6")
          errors << "fake-ip-range6 still forced" if dns.key?("fake-ip-range6")
          errors << "TUN IPv6 address still forced" if tun.key?("inet6-address")
          groups = Array(main["proxy-groups"]).to_h { |group| [group["name"], group] }
          errors << "Vietnam not DIRECT-first" unless Array(groups.dig("越南服务", "proxies")).first == "DIRECT"
          errors << "AI not automatic-first" unless Array(groups.dig("AI", "proxies")).first.to_s.end_with?("-自动")
          rules = Array(main["rules"])
          ad_index = rules.index("RULE-SET,reject,广告过滤")
          openai_index = rules.index("RULE-SET,openai,AI")
          errors << "ad rule priority incorrect" unless ad_index && openai_index && ad_index < openai_index
          Hash(main["rule-providers"] || {}).each do |name, provider|
            errors << "provider #{name} lacks proxy" unless provider["proxy"] == "节点选择"
          end
          Hash(stash["rule-providers"] || {}).each do |name, provider|
            errors << "Stash provider #{name} still uses GitHub Raw" if provider["url"].to_s.include?("raw.githubusercontent.com")
          end
          errors << "Stash dns.ipv6 still forced" if Hash(stash["dns"] || {}).key?("ipv6")
          abort errors.join("\n") if errors.any?
          puts "Semantic checks passed."
          RUBY

      - name: Test with latest Mihomo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          url="$(echo "$release_json" | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v1-v.*\\.gz$")) | .browser_download_url' | head -n 1)"
          test -n "$url"
          curl --retry 3 --retry-delay 2 --retry-connrefused -fsSL "$url" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          ./mihomo -v
          ./mihomo -t -f "防DNS泄露.yaml"

      - name: Commit patched configuration
        run: |
          rm -f mihomo
          git restore --source=HEAD -- .github/workflows/validate-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 防DNS泄露.yaml 防DNS泄露.js stash.stoverride README.md
          git commit -m "fix: harden Mihomo DNS and routing defaults"
          git push origin HEAD:agent/fix-mihomo-config
