name: Diagnose config synchronization

on:
  pull_request:
    paths:
      - ".github/workflows/validate-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build synchronization diagnostic
        run: |
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "yaml"

          keys = %w[unified-delay profile geo-auto-update geo-update-interval tcp-concurrent sniffer tun dns proxy-groups rule-providers rules]
          yaml_config = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)

          node_code = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const file = process.argv[process.argv.length - 1];
            const code = fs.readFileSync(file, "utf8");
            const sandbox = { console };
            vm.createContext(sandbox);
            const result = vm.runInContext(`${code}\n;main({});`, sandbox, { filename: file });
            process.stdout.write(JSON.stringify(result));
          NODE
          stdout, stderr, status = Open3.capture3("node", "-e", node_code, "防DNS泄露.js")
          abort stderr unless status.success?
          js_config = JSON.parse(stdout)

          def normalize(value, path = [])
            case value
            when Hash
              value.keys.sort.to_h { |key| [key, normalize(value[key], path + [key.to_s])] }
            when Array
              values = value.map { |item| normalize(item, path) }
              path.last == "ports" ? values.map(&:to_s) : values
            else
              path.last == "expected-status" ? value.to_s : value
            end
          end

          def first_diff(a, b, path = "$")
            return "#{path}: class #{a.class} != #{b.class}" unless a.class == b.class
            if a.is_a?(Hash)
              return "#{path}: keys #{a.keys.inspect} != #{b.keys.inspect}" unless a.keys == b.keys
              a.each_key do |key|
                diff = first_diff(a[key], b[key], "#{path}.#{key}")
                return diff if diff
              end
            elsif a.is_a?(Array)
              return "#{path}: length #{a.length} != #{b.length}" unless a.length == b.length
              a.each_index do |index|
                diff = first_diff(a[index], b[index], "#{path}[#{index}]")
                return diff if diff
              end
            elsif a != b
              return "#{path}: #{a.inspect} != #{b.inspect}"
            end
            nil
          end

          yaml_selected = normalize(keys.to_h { |key| [key, yaml_config[key]] })
          js_selected = normalize(keys.to_h { |key| [key, js_config[key]] })
          diff = first_diff(yaml_selected, js_selected) || "MATCH"

          File.write("sync-diff.txt", diff + "\n")
          File.write("yaml-selected.json", JSON.pretty_generate(yaml_selected))
          File.write("js-selected.json", JSON.pretty_generate(js_selected))
          puts diff
          RUBY

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: config-sync-diagnostic
          path: |
            sync-diff.txt
            yaml-selected.json
            js-selected.json
          retention-days: 1
