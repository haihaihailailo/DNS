name: Patch missing JS rule providers

on:
  pull_request:
    paths:
      - ".github/workflows/validate-config.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/fix-mihomo-config'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Add missing JavaScript rule providers
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("防DNS泄露.js")
          text = path.read_text(encoding="utf-8")
          providers = '''  twitter: { ...META_DOMAIN_PROVIDER, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/twitter.mrs", path: "./ruleset/metacubex/twitter.mrs" },
            facebook: { ...META_DOMAIN_PROVIDER, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/facebook.mrs", path: "./ruleset/metacubex/facebook.mrs" },
            steam: { ...META_DOMAIN_PROVIDER, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs", path: "./ruleset/metacubex/steam.mrs" },
            "category-games": { ...META_DOMAIN_PROVIDER, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games.mrs", path: "./ruleset/metacubex/category-games.mrs" },
          '''
          providers = "\n".join(line.lstrip() if i == 0 else "  " + line.lstrip() for i, line in enumerate(providers.splitlines())) + "\n"
          anchor = '  telegramcidr: { type: "http", behavior: "ipcidr", format: "mrs", interval: 86400, proxy: "节点选择", url:'
          if '  twitter: { ...META_DOMAIN_PROVIDER' not in text:
              if anchor not in text:
                  raise SystemExit("telegramcidr provider anchor not found")
              text = text.replace(anchor, providers + anchor, 1)
          for name in ["twitter", "facebook", "steam", "category-games"]:
              if name not in text:
                  raise SystemExit(f"missing provider after patch: {name}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript syntax and YAML sync
        run: |
          node --check "防DNS泄露.js"
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "yaml"
          keys = %w[unified-delay profile geo-auto-update geo-update-interval tcp-concurrent sniffer tun dns proxy-groups rule-providers rules]
          yaml_config = YAML.safe_load_file("防DNS泄露.yaml", aliases: true)
          node_code = <<~'NODE'
            const fs = require("fs");
            const vm = require("vm");
            const code = fs.readFileSync("防DNS泄露.js", "utf8");
            const sandbox = { console };
            vm.createContext(sandbox);
            process.stdout.write(JSON.stringify(vm.runInContext(`${code}\n;main({});`, sandbox)));
          NODE
          stdout, stderr, status = Open3.capture3("node", "-e", node_code)
          abort stderr unless status.success?
          js_config = JSON.parse(stdout)
          normalize = lambda do |value, path = []|
            case value
            when Hash
              value.keys.sort.to_h { |key| [key, normalize.call(value[key], path + [key.to_s])] }
            when Array
              values = value.map { |item| normalize.call(item, path) }
              path.last == "ports" ? values.map(&:to_s) : values
            else
              path.last == "expected-status" ? value.to_s : value
            end
          end
          yaml_selected = normalize.call(keys.to_h { |key| [key, yaml_config[key]] })
          js_selected = normalize.call(keys.to_h { |key| [key, js_config[key]] })
          abort "YAML and JS are still not synchronized" unless yaml_selected == js_selected
          puts "YAML and JS are synchronized."
          RUBY

      - name: Commit JavaScript provider fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 防DNS泄露.js
          git commit -m "fix: synchronize JavaScript rule providers"
          git push origin HEAD:agent/fix-mihomo-config
